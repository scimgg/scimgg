name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels its older run. Pushes to main group by commit, so every
# merged commit keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Before npm ci, so a lockfile entry pointing at another source fails before npm fetches it.
      # Bare node, not npm run: npm would also run any pre- and post-scripts in package.json and
      # read .npmrc settings such as script-shell, all of which a pull request can change.
      - run: node scripts/check-lockfile.mjs

      # Blocks a pull request that adds or updates a dependency with a known vulnerability.
      # Development dependencies count too: they run on contributors' machines and in CI.
      # Licenses are left to `npm run check:licenses`, which holds this project's policy.
      - if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          license-check: false

      - run: npm ci
      - run: npm run typecheck
      - run: npx biome ci .
      - run: npm run check:licenses
      # Runs without `npm run setup`: tests that need the game assets skip.
      - run: npm test
